name: cross-device-sync
version: 6.4.0
description: "让 WorkBuddy 在多台 Windows 电脑之间无缝同步——WPS 云盘做中转媒介，SQLite 数据库本地独立防覆盖，配合 Junction 统一工作区路径与守护进程（单 leader 选举 / 崩溃自愈 / 卡死自愈），通过 HANDOFF.md 交接单实现跨设备任务接续。适用于「跨设备同步」「跨电脑同步」「workbuddy 数据库隔离」「workbuddy 会话接续」「workspace deleted or renamed」「双电脑办公」「移动办公」「WorkBuddy 5.4.7 IndexedDB 丢消息过渡」等场景。"
category: sync-tools
